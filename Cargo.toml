[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ernar/byteforest"
authors = ["Ernar"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bitflags = "2"
thiserror = "2"
insta = "1"
serde_json = "1"
rayon = "1"
crossbeam-channel = "0.5"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
bf-core = { path = "crates/bf-core" }
bf-ntfs = { path = "crates/bf-ntfs" }
bf-scan = { path = "crates/bf-scan" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
