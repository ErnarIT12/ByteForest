# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)

[graph]
# Windows is the only supported platform. Tauri's Windows tree (wry, webview2-com,
# windows, ...) is included; the Linux CI job still checks that same graph.
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
yanked = "warn"
# Vulnerabilities are always errors in the v2 schema.
# `unmaintained` is a SCOPE, not a severity: "all" checks workspace and transitive
# crates, and any hit fails the check (it is an error, not a warning). If a
# transitive dependency we cannot fix gets flagged, add its advisory id to `ignore`
# with a reason instead of weakening the scope. Currently nothing is flagged.
unmaintained = "all"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
