[package]
name = "byteforest-app"
description = "ByteForest desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
bf-core = { workspace = true }
bf-scan = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = "2"
tracing = { workspace = true }
trash = "5"
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Storage_FileProperties", "Storage_Streams"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
