<!-- ByteForest Animated Logo | Палитра: Чистый монохром (Серебро / Графит) | Режим: Цикл анализа -->
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ByteForest">
  <style>
    .bf-platter-cw { transform-origin: 120px 122px; animation: bfSpinCW 18s linear infinite; }
    .bf-platter-ccw { transform-origin: 120px 122px; animation: bfSpinCCW 26s linear infinite; }
    .bf-scanner-arm { transform-origin: 120px 122px; animation: bfSpinCW 5.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .bf-sector { stroke: #e5e7eb; opacity: 0.16; animation: bfSectorPulse 5.6s ease-in-out infinite; }
    .bf-s1 { animation-delay: calc(5.6s * -0.88); }
    .bf-s2 { animation-delay: calc(5.6s * -0.75); }
    .bf-s3 { animation-delay: calc(5.6s * -0.62); }
    .bf-s4 { animation-delay: calc(5.6s * -0.48); }
    .bf-s5 { animation-delay: calc(5.6s * -0.35); }
    .bf-s6 { animation-delay: calc(5.6s * -0.22); }
    .bf-s7 { animation-delay: calc(5.6s * -0.10); }
    .bf-tier { transform-origin: 120px 128px; animation: bfTierBreathe 5.6s ease-in-out infinite; }
    .bf-t1 { animation-delay: 0s; }
    .bf-t2 { animation-delay: calc(5.6s * 0.12); }
    .bf-t3 { animation-delay: calc(5.6s * 0.22); }
    .bf-t4 { animation-delay: calc(5.6s * 0.34); }
    .bf-t5 { animation-delay: calc(5.6s * 0.44); }
    .bf-t6 { animation-delay: calc(5.6s * 0.54); }
    .bf-apex { fill: #f3f4f6; animation: bfApexPulse 5.6s ease-in-out infinite; }
    .bf-pcb-1 { stroke: #f9fafb; stroke-dasharray: 7 32; animation: bfPcbFlow 2.2s linear infinite; }
    .bf-pcb-2 { stroke: #f9fafb; stroke-dasharray: 5 26; animation: bfPcbFlow 2.2s linear infinite; animation-delay: calc(2.2s * -0.45); }
    .bf-node { fill: #f3f4f6; animation: bfNodeBlink 2.2s ease-in-out infinite; }
    .bf-node-2 { animation-delay: calc(2.2s * -0.5); }
    .bf-pt { fill: #f3f4f6; animation: bfParticleRise 3.8s ease-in-out infinite; }
    .bf-pt-line { stroke: #f3f4f6; animation: bfParticleRise 3.8s ease-in-out infinite; }
    .bf-d1 { animation-delay: 0s; }
    .bf-d2 { animation-delay: calc(3.8s * -0.25); }
    .bf-d3 { animation-delay: calc(3.8s * -0.52); }
    .bf-d4 { animation-delay: calc(3.8s * -0.74); }
    .bf-d5 { animation-delay: calc(3.8s * -0.15); }
    .bf-d6 { animation-delay: calc(3.8s * -0.63); }

    @keyframes bfSpinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bfSpinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes bfSectorPulse { 0%, 100% { opacity: 0.14; stroke-width: 6.5; } 18% { opacity: 0.82; stroke-width: 8.5; } 42% { opacity: 0.24; stroke-width: 6.5; } }
    @keyframes bfTierBreathe { 0%, 100% { transform: translateY(0px) scale(1); filter: brightness(1); } 24% { transform: translateY(-1.6px) scale(1.018); filter: brightness(1.16); } 55% { transform: translateY(0px) scale(1); filter: brightness(1); } }
    @keyframes bfApexPulse { 0%, 100% { opacity: 0.45; } 25% { opacity: 0.95; } 60% { opacity: 0.5; } }
    @keyframes bfPcbFlow { from { stroke-dashoffset: 39; } to { stroke-dashoffset: 0; } }
    @keyframes bfNodeBlink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes bfParticleRise { 0% { transform: translateY(5px); opacity: 0; } 30% { opacity: 0.9; } 75% { opacity: 0.75; } 100% { transform: translateY(-9px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bfRim" x1="24" y1="12" x2="216" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="0.72" />
      <stop offset="35%" stop-color="#4b5563" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#27292e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6b7280" stop-opacity="0.55" />
    </linearGradient>
    <radialGradient id="bfBg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#353941" />
      <stop offset="52%" stop-color="#22252a" />
      <stop offset="100%" stop-color="#141518" />
    </radialGradient>
    <radialGradient id="bfPlatter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="0.16" />
      <stop offset="58%" stop-color="#6b7280" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#1f2126" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bfBeam" x1="120" y1="122" x2="178" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3f4f6" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#f3f4f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f3f4f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bfTop" x1="120" y1="30" x2="120" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="48%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#7b818c" />
    </linearGradient>
    <linearGradient id="bfLight" x1="65" y1="80" x2="145" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5e7eb" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient id="bfMid" x1="175" y1="86" x2="92" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="52%" stop-color="#7c828d" />
      <stop offset="100%" stop-color="#373b42" />
    </linearGradient>
    <linearGradient id="bfDeep" x1="48" y1="130" x2="188" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b4bac4" />
      <stop offset="55%" stop-color="#6b7280" />
      <stop offset="100%" stop-color="#2c3037" />
    </linearGradient>
    <linearGradient id="bfTrunk" x1="120" y1="166" x2="120" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2025" />
      <stop offset="45%" stop-color="#32363f" />
      <stop offset="100%" stop-color="#23262c" />
    </linearGradient>
    <clipPath id="bfClip">
      <rect x="10" y="10" width="220" height="220" rx="48" />
    </clipPath>
    <filter id="bfShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="4.5" stdDeviation="4" flood-color="#090a0c" flood-opacity="0.62" />
    </filter>
    <filter id="bfGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="230" height="230" rx="52" fill="#23252a" stroke="url(#bfRim)" stroke-width="2" />
