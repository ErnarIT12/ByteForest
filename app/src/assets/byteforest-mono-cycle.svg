      <path d="M 116 74 C 138 91 160 109 178 130 C 179.8 132 178.2 134.6 175.4 134.5 C 151 133.5 129 120 112 97 Z" fill="url(#bfMid)" stroke="#e5e7eb" stroke-opacity="0.28" stroke-width="0.75" />
