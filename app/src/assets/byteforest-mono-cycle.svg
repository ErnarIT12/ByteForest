      <path class="bf-pcb-2" d="M 123.5 214 L 123.5 188 L 126.5 184 L 126.5 174" />
      <path class="bf-pcb-1" d="M 130 214 L 130 193" />
    </g>
    <circle class="bf-node" cx="108.5" cy="181" r="1.8" />
