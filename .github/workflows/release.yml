name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows installers
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --ci
      - name: Package CLI
        shell: pwsh
        run: |
          cargo build --locked -p bf-cli --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -DestinationPath "byteforest-cli-$env:GITHUB_REF_NAME-x64.zip" -Path $(
            'target/release/byteforest.exe', 'LICENSE-MIT', 'LICENSE-APACHE', 'README.md'
          )
      - uses: actions/upload-artifact@v4
        with:
          name: byteforest-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            byteforest-cli-*.zip
          if-no-files-found: error

  macos:
    uses: ./.github/workflows/macos-package.yml

  draft:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: byteforest-*
          path: packed
      - name: Verify and publish assets to a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          for pattern in '*.exe' '*.msi' '*.zip' '*.dmg'; do
            mapfile -d '' -t files < <(find packed -type f -name "$pattern" -print0)
            [[ ${#files[@]} -eq 1 ]]
            cp "${files[0]}" assets/
          done
          cd assets
          sha256sum *.exe *.msi *.zip *.dmg > SHA256SUMS.txt

          tag="$GITHUB_REF_NAME"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            [[ "$draft" == "true" ]]
            gh release upload "$tag" --clobber ./*
          else
            flags=()
            [[ "$tag" == v0.* ]] && flags+=(--prerelease)
            gh release create "$tag" --verify-tag --draft "${flags[@]}" --title "ByteForest $tag" \
              --notes "See the [changelog](https://github.com/$GH_REPO/blob/$tag/CHANGELOG.md). The macOS beta DMG supports macOS 15 or later on Apple Silicon and Intel. The app is ad hoc signed and is not notarized. See the README for installation and verify downloads using SHA256SUMS.txt." ./*
          fi
