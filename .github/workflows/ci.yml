name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      scanner: ${{ steps.scope.outputs.scanner }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code=true
          scanner=true
          package=true
          # For PRs, HEAD is the trial merge and BASE its first parent.
          # Manual runs and unavailable push bases get every check.
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed-paths"
            code=false
            scanner=false
            package=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|README.*.md|CHANGELOG.md|CONTRIBUTING.md|docs/screenshots/*.png) continue ;;
              esac
              code=true
              case "$path" in
                crates/bf-scan/*|crates/bf-core/*|crates/bf-ntfs/*|Cargo.*|rust-toolchain.toml|.cargo/*|.github/workflows/ci.yml) scanner=true ;;
              esac
              case "$path" in
                app/src-tauri/*|app/package*.json|Cargo.*|rust-toolchain.toml|.cargo/*|.github/workflows/*) package=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              scanner=$code
              package=$code
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "scanner=$scanner" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The app crate embeds the built frontend, so build it before cargo.
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Compares the MFT scanner with the directory walker on the runner's real system
  # drive. The tolerances in mft_vs_walk were tuned on the owner's machine; a hosted
  # runner's C: (large WinSxS hard-link population, files changing during a long
  # walk) may exceed them. Non-gating (continue-on-error) until the bounds are
  # validated on hosted runners; then remove continue-on-error to make it gating.
  # GitHub's Windows runners run elevated. Only bf-scan and its crates are built,
  # so the frontend is not needed.
  admin-scan:
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Admin integration test (MFT vs directory walk)
        env:
          BF_ADMIN_TESTS: "1"
        run: cargo test -p bf-scan --release --test mft_vs_walk -- --include-ignored --nocapture

  ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  mac-rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  mac-package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/macos-package.yml

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
